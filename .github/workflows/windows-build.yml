name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows executable
        run: dotnet publish .\DiscordSteamTray.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None -o .\publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordSteamTray-win-x64
          path: publish/DiscordSteamTray.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: DiscordSteamTray-win-x64
          path: release-assets

      - name: Extract release notes from changelog
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use the vMAJOR.MINOR.PATCH format."
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $headingPattern = '^## \[' + [regex]::Escape($version) + '\](\s|$)'
          $lines = Get-Content CHANGELOG.md
          $sectionStart = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $headingPattern) {
              $sectionStart = $i + 1
              break
            }
          }

          if ($sectionStart -lt 0) {
            throw "CHANGELOG.md must contain a '## [$version]' section before creating this release."
          }

          $releaseLines = [System.Collections.Generic.List[string]]::new()
          for ($i = $sectionStart; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) {
            $releaseLines.Add($lines[$i])
          }

          $releaseNotes = ($releaseLines -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw "The changelog section for version $version is empty."
          }

          [System.IO.File]::WriteAllText(
            "release-notes.md",
            $releaseNotes,
            [System.Text.UTF8Encoding]::new($false))

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/DiscordSteamTray.exe --title "Discord Steam Tray $RELEASE_TAG" --notes-file release-notes.md --verify-tag
